<title>Yedinin Köşegeni · Eksen 9.7.2</title>
<meta name="description" content="Tavla masasında zarlar 4 ve 3 gelir: yine 7. Neden en çok 7 gelir? Film, iki zarın 36 eş olasılıklı sonucunu bir 6×6 ızgaraya dizer; her köşegen bir toplamdır ve en uzunu 7'nin köşegenidir. Örnek uzay sistematik liste, tablo ve ağaç şemasıyla (üç para atışı) görünür kılınır; P(A) = olaya ait çıktılar / tüm çıktılar ile P(7) = 1/6, P(2) = 1/36 ve tümleyen hesaplanır. Sürpriz dönüşümde ızgara 45° döner ve hücreler çökerek dağılımın üçgenini oluşturur. Ayrık ve ayrık olmayan olaylarda birleşim kuralı ızgarada gösterilir; sonda 36 000 atışlık simülasyonun çubukları teorik basamaklara oturur.">
