<title>Aynı Ortalama · Eksen 9.6.1</title>
<meta name="description" content="İki otobüs hattının ortalama bekleme süresi aynı: 10 dakika. Ama biri sıkışık, öteki dağınık. Film istatistiksel araştırma döngüsünü (soru, plan, veri, analiz, yorum) kısaca kurar, sonra 29 öğrencinin ekran süresi verisini nokta grafiğinden histograma, histogramdan kutu grafiğine dönüştürür. Ortalama, ortanca, tepe değer, açıklık, çeyrekler açıklığı ve standart sapma ekranda veriden hesaplanır. Sürpriz: 600 dakikalık tek bir değer terazinin dengesini bozar; ortalama 150'den 165'e kayar, ortanca 150'de kalır. Sonunda otobüs kararı yayılıma ve belirsizlik diline dayanarak verilir.">
