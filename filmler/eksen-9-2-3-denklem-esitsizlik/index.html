<title>Kesişim Anı · Eksen 9.2.3</title>
<meta name="description" content="İki mobil hat tarifesi (A: 100 TL + GB başına 20 TL, B: 220 TL + GB başına 5 TL) iki ışık doğrusu olarak yarışır ve 8 GB'ta, 260 TL'de kesişir. Film denklemi iki doğrunun buluştuğu an, eşitsizliği bir doğrunun diğerinin altında kaldığı aralık olarak gösterir: denklem grafikten, cebirle ve yerine koyarak üç yoldan çözülür; eşitsizliğin çözüm kümesi bağlamın kısıtıyla [0, 8) olur. Öbür doğru x eksenine dönüşünce f(x) < 0 sorusu ortaya çıkar (2x − 6 < 0 ⇒ x < 3). Termostat örneğinde |x − 20| ≤ 2 bir bant çizer: [18, 22]. Sürpriz: arz ve talep doğruları; fiyat salınarak kesişime, denge fiyatı 60'a oturur.">
