<title>Katlanan Doğru · Eksen 9.2.2</title>
<meta name="description" content="Durağa yürüyen birinin durağa uzaklığı önce azalır, durakta sıfır olur, sonra artar: grafik bir V çizer, |x − 3|. Film, mutlak değeri bir doğrunun x ekseninin altında kalan parçasını yukarı katlamak olarak gösterir. Önce f(x) = x ile n(x) = |x| karşılaştırılır (benzerlikler ve farklar tablosu, −|x|). Sonra h(x) = 2x − 4'ün alt yarı düzlemi, x ekseni menteşe olacak biçimde perspektifli bir katlamayla 180° döner ve doğrunun negatif parçası üste kapanır; iki kolun denklemleri parçalı gösterimde birleşir. m(x) = |2x − 4| − 1 için parçalı yazılış, sıfırlar ve tepe; son olarak ±|ax + b| + c ailesinin nitel özellikleri (tepe, simetri ekseni, görüntü kümesi, artan–azalan aralıklar, sıfır sayısı) c kaydırılarak ve V ters çevrilerek çıkarılır.">
