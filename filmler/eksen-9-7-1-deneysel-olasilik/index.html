<meta name="description" content="İki zar 10 kez atılınca toplamların sütunları karmakarışıktır; 10 000 atışta ışık parçacıklarından kusursuz bir üçgen doğar. Film, deneysel olasılığı bu &quot;gürültünün sönmesi&quot; üzerinden anlatır: 25 atışlık bir sınıf deneyi çeteleye, sıklık ve göreli sıklık tablosuna işlenir; toplam 7'nin göreli sıklığı 25, 50, 100, 150, 200 atıştan simülasyonla 500, 1000, 1500 atışa izlenir. 41 simülasyonun eğrileri daralan bir huni oluşturur (Büyük Sayılar Yasası). Sonda bu huni, bir oyundaki zarın adil olup olmadığına karar vermek için kullanılır.">
