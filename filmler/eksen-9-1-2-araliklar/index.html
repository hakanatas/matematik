<meta name="description" content="Gece yarısı bir aşı dolabı: &quot;2 °C ile 8 °C arasında saklayın.&quot; Sıcaklık tam 8 °C'ye çıkınca soru doğar: sınır içeride mi? Film aralıkları sayı doğrusuna düşen ışık hüzmeleri olarak gösterir: kapalı uç dolu ışık noktası, açık uç boş halka. Aynı ışın eşitsizlik, aralık ve küme gösterimiyle yazılır; günlük durumlara uygun sembol seçilir; birleşim, kesişim, fark ve tümleme ışığın davranışı olarak canlanır. Sürpriz: |x − 5| ≤ 3 bir projektördür ve açılıştaki aşı dolabının aralığını verir; aynı fikir vida üretimindeki toleransta da çalışır.">
