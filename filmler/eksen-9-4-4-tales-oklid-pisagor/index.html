<title>Kaybolmayan Alan · Eksen 9.4.4</title>
<meta name="description" content="3-4-5 dik üçgeninin dik kenarlarındaki 9 ve 16 birim kare, hipotenüs üzerindeki 25'lik kareyi tam doldurur; peki her dik üçgende mi? Film önce Tales teoremini ispatlar: paralel üç doğru iki keseni orantılı parçalara ayırır (3 / 4,5 = 2,5 / 3,75); kesen A'dan geçecek şekilde paralel kaydırılınca benzer üçgenler ve paralelkenarlar ispatı tamamlar. Ardından hipotenüse indirilen yüksekliğin doğurduğu benzer üçgenlerden Öklid bağıntıları (h² = p·k, c² = p·a, b² = k·a) çıkar. Sürpriz anda dik kenar kareleri kesme ve kaydırmayla, alanları hiç değişmeden hipotenüs karesinin p×a ve k×a dikdörtgenlerine dönüşür: a² = b² + c². Son olarak açı 90°'den saptığında geniş açıda a² > b² + c², dar açıda a² < b² + c² olduğu görülür.">
