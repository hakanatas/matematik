<meta name="description" content="Gün batımında bir minarenin boyunu ona tırmanmadan bulmak mümkün mü? Film, benzer üçgenleri dokunamadığımız uzunlukları ölçen bir araç olarak gösterir: gölge yöntemiyle 34 m'lik minare, aynayla 9 m'lik ağaç ve kazıklarla 15 m'lik nehir genişliği. Ekranın üstünde ilerleyen problem çözme şeridi (verilen → çizim → strateji → çözüm → kontrol) her ölçümü bir saha çalışmasına dönüştürür; kontrol, kısa yol, yanlış strateji ve hangi yöntemin hangi probleme uyduğu da tartışılır.">
